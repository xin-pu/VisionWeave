name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VisionWeave.slnx

      - name: Build
        run: dotnet build VisionWeave.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VisionWeave.slnx --no-build --configuration Release

      - name: Verify formatting
        run: dotnet format VisionWeave.slnx --verify-no-changes --no-restore

      - name: Validate project documents
        shell: pwsh
        run: ./scripts/Test-ProjectDocuments.ps1
